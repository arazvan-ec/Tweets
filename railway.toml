# Web service config — serves the Flask UI/API.
# The cron service is a separate Railway service from the same repo using
# railway.cron.toml as its config (set the path in its Settings → Config-as-code).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 server.main:app'"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
