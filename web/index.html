<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tweets</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a href="#" class="brand" data-route="home">Tweets</a>
  <div class="header-right">
    <span id="freshness" class="freshness"></span>
    <button type="button" id="refresh-btn" class="btn-primary" title="Captura nuevos tweets ahora">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17.5 4.5h2v6h-6v-2h2.69c-.92-1.83-2.81-3-4.69-3C8.69 5.5 6 7.92 6 12s2.69 6.5 6.5 6.5c2.59 0 4.96-1.55 5.99-3.94l1.84.79C19.04 18.4 15.93 20.5 12.5 20.5 7.59 20.5 4 16.93 4 12s3.59-8.5 8.5-8.5c2.5 0 4.81 1.31 6.13 3.45L17.5 4.5z"/></svg>
      <span id="refresh-label">Actualizar</span>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <a class="tab active" data-tab="for_you" href="#for_you">Para ti</a>
  <a class="tab" data-tab="following" href="#following">Siguiendo</a>
  <a class="tab" data-tab="mine" href="#mine">Mis tweets</a>
</nav>

<div class="controls" id="controls">
  <input type="search" id="search" placeholder="🔍 Buscar texto, autor, handle...">
  <select id="type-filter" title="Tipo">
    <option value="all">Todos</option>
    <option value="original">Originales</option>
    <option value="retweet">Retweets</option>
    <option value="reply">Respuestas</option>
    <option value="quote">Citas</option>
    <option value="media">Multimedia</option>
  </select>
  <select id="sort-by" title="Ordenar por">
    <option value="first_seen_desc">Recién capturados</option>
    <option value="date_desc">Más recientes</option>
    <option value="date_asc">Más antiguos</option>
    <option value="likes">Más likes</option>
    <option value="retweets">Más retweets</option>
    <option value="replies">Más respuestas</option>
    <option value="views">Más vistas</option>
  </select>
</div>

<div id="ptr-indicator" class="ptr-indicator" aria-hidden="true">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.5 4.5h2v6h-6v-2h2.69c-.92-1.83-2.81-3-4.69-3C8.69 5.5 6 7.92 6 12s2.69 6.5 6.5 6.5c2.59 0 4.96-1.55 5.99-3.94l1.84.79C19.04 18.4 15.93 20.5 12.5 20.5 7.59 20.5 4 16.93 4 12s3.59-8.5 8.5-8.5c2.5 0 4.81 1.31 6.13 3.45L17.5 4.5z"/></svg>
</div>

<main id="content"></main>

<div id="scroll-sentinel" class="scroll-sentinel"></div>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" data-action="lb-close" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M10.59 12L4.54 5.96l1.42-1.42L12 10.59l6.04-6.05 1.42 1.42L13.41 12l6.05 6.04-1.42 1.42L12 13.41l-6.04 6.05-1.42-1.42L10.59 12z"/></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" data-action="lb-prev" aria-label="Anterior">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M14.41 7.41L13 6l-6 6 6 6 1.41-1.41L9.83 12z"/></svg>
  </button>
  <button class="lightbox-nav lightbox-next" data-action="lb-next" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M9.59 7.41L11 6l6 6-6 6-1.41-1.41L14.17 12z"/></svg>
  </button>
  <div class="lightbox-stage" data-action="lb-close">
    <div class="lightbox-stage-inner" id="lightbox-stage" data-stop-bubble></div>
  </div>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script src="app.js"></script>
</body>
</html>
