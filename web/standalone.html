<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweets Browser</title>
<style>
:root {
  --bg: #000000;
  --bg-elev: #16181c;
  --bg-hover: #080808;
  --bg-card-hover: rgba(255, 255, 255, 0.03);
  --border: #2f3336;
  --border-light: #2f3336;
  --text: #e7e9ea;
  --text-muted: #71767b;
  --accent: #1d9bf0;
  --green: #00ba7c;
  --red: #f91880;
  --yellow: #ffd400;
  --pink: #f91880;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.3px;
}

#stats {
  font-size: 13px;
  color: var(--text-muted);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 49px;
  z-index: 15;
}

.controls label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

.controls select,
.controls input {
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 6px 12px;
  font-size: 13px;
  font-family: inherit;
}

.controls input[type="search"] {
  flex: 1;
  min-width: 150px;
}

.controls select:focus,
.controls input:focus {
  outline: none;
  border-color: var(--accent);
}

main {
  max-width: 600px;
  margin: 0 auto;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  min-height: calc(100vh - 100px);
}

@media (max-width: 640px) {
  main {
    border-left: none;
    border-right: none;
  }
}

/* Tweet card */
.tweet {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: default;
  transition: background 0.15s;
}

.tweet:hover {
  background: var(--bg-card-hover);
}

.tweet-avatar {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-elev);
  overflow: hidden;
}

.tweet-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.tweet-body {
  flex: 1;
  min-width: 0;
}

.tweet-context {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: -52px;
  padding-left: 10px;
}

.tweet-context svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.tweet-header {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  font-size: 15px;
  margin-bottom: 2px;
}

.tweet-name {
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.tweet-name:hover { text-decoration: underline; }

.tweet-handle, .tweet-sep, .tweet-date {
  color: var(--text-muted);
  font-weight: 400;
  font-size: 15px;
}

.tweet-date {
  text-decoration: none;
}

.tweet-date:hover { text-decoration: underline; }

.verified-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.verified-icon.blue { fill: var(--accent); }
.verified-icon.gold { fill: var(--yellow); }

.replying-to {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.replying-to a {
  color: var(--accent);
  text-decoration: none;
}

.replying-to a:hover { text-decoration: underline; }

.tweet-text {
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 8px;
  font-size: 15px;
  line-height: 1.4;
}

.tweet-text a {
  color: var(--accent);
  text-decoration: none;
}

.tweet-text a:hover { text-decoration: underline; }

/* Media grid */
.media-grid {
  margin-top: 12px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border);
  display: grid;
  gap: 2px;
  max-height: 510px;
}

.media-grid.count-1 { grid-template-columns: 1fr; }
.media-grid.count-2 { grid-template-columns: 1fr 1fr; }
.media-grid.count-3 {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.media-grid.count-3 .media-item:first-child {
  grid-row: span 2;
}
.media-grid.count-4 {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.media-item {
  background: var(--bg-elev);
  position: relative;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}

.media-grid.count-1 .media-item { aspect-ratio: auto; max-height: 510px; }

.media-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.media-grid.count-1 .media-item img {
  object-fit: contain;
  background: var(--bg-elev);
}

.media-item .video-badge {
  position: absolute;
  bottom: 8px;
  left: 8px;
  background: rgba(0, 0, 0, 0.75);
  color: var(--text);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* URL card */
.url-card {
  display: block;
  text-decoration: none;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 14px;
  margin-top: 12px;
  background: transparent;
  transition: background 0.15s;
}

.url-card:hover { background: var(--bg-card-hover); }

.url-card .url-card-link {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.url-card .url-card-link::before {
  content: '';
  display: inline-block;
  width: 14px;
  height: 14px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2371767b"><path d="M11.96 14.945c-.067 0-.136-.01-.203-.027-1.13-.318-2.097-.986-2.795-1.932-.832-1.125-1.176-2.508-.968-3.893s.942-2.605 2.068-3.438l3.53-2.608c2.322-1.716 5.61-1.224 7.33 1.1.83 1.127 1.175 2.51.967 3.895s-.943 2.605-2.07 3.438l-1.48 1.094c-.333.246-.804.175-1.05-.158-.246-.334-.176-.804.158-1.05l1.48-1.095c.803-.592 1.327-1.463 1.476-2.45.148-.988-.098-1.975-.69-2.778-1.225-1.656-3.572-2.01-5.23-.784l-3.53 2.608c-.802.593-1.326 1.464-1.475 2.45-.15.99.097 1.975.69 2.778.498.675 1.187 1.15 1.992 1.377.4.114.633.528.52.928-.092.33-.394.547-.722.547z"/></svg>');
  background-size: contain;
}

/* Embedded quote tweet */
.quote-tweet {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px;
  margin-top: 12px;
  background: transparent;
  transition: background 0.15s;
}

.quote-tweet:hover { background: var(--bg-card-hover); }

.quote-tweet .quote-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  margin-bottom: 4px;
}

.quote-tweet .quote-avatar {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
}

.quote-tweet .quote-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.quote-tweet .quote-name {
  font-weight: 700;
  color: var(--text);
}

.quote-tweet .quote-handle,
.quote-tweet .quote-sep,
.quote-tweet .quote-date {
  color: var(--text-muted);
  font-size: 14px;
}

.quote-tweet .quote-text {
  font-size: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
}

.quote-tweet .media-grid {
  margin-top: 8px;
  max-height: 280px;
}

/* Engagement bar */
.tweet-actions {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
  max-width: 425px;
  color: var(--text-muted);
}

.tweet-action {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: default;
  user-select: none;
  padding: 4px;
  border-radius: 9999px;
}

.tweet-action svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.tweet-action:hover.action-reply { color: var(--accent); }
.tweet-action:hover.action-retweet { color: var(--green); }
.tweet-action:hover.action-like { color: var(--pink); }
.tweet-action:hover.action-bookmark { color: var(--accent); }
.tweet-action:hover.action-views { color: var(--accent); }

/* Misc */
.lang-badge {
  display: inline-block;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0 5px;
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-left: 4px;
  vertical-align: middle;
}

.empty {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 20px;
}

.error {
  text-align: center;
  color: var(--red);
  padding: 20px;
  background: rgba(249, 24, 128, 0.1);
  border: 1px solid var(--red);
  border-radius: 8px;
  margin: 20px;
}

footer {
  text-align: center;
  padding: 24px;
  color: var(--text-muted);
  font-size: 12px;
}

footer code {
  background: var(--bg-elev);
  padding: 2px 6px;
  border-radius: 4px;
}

.spinner {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}

</style>
</head>

<header>
  <h1>Tweets Browser</h1>
  <div id="stats"></div>
</header>

<div class="controls">
  <label>
    Snapshot:
    <select id="snapshot-select"></select>
  </label>
  <label>
    Fuente:

      <option value="timeline">Home timeline</option>
      <option value="mine">Mis tweets</option>
    </select>
  </label>
  <label>
    Tipo:
    <select id="type-filter">
      <option value="all">Todos</option>
      <option value="original">Solo originales</option>
      <option value="retweet">Retweets</option>
      <option value="reply">Respuestas</option>
      <option value="quote">Citas</option>
      <option value="media">Con multimedia</option>
    </select>
  </label>
  <label>
    Ordenar:
    <select id="sort-by">
      <option value="date_desc">Más recientes</option>
      <option value="date_asc">Más antiguos</option>
      <option value="likes">Más likes</option>
      <option value="retweets">Más retweets</option>
      <option value="replies">Más respuestas</option>
      <option value="views">Más vistas</option>
    </select>
  </label>
  <input type="search" id="search" placeholder="Buscar texto, autor...">
</div>

<main id="tweets"></main>

<footer>
  <small>Versión autocontenida — 4 snapshots embebidos.</small>
</footer>

s://x.com/rseroter/status/2051808871933792758", "media": [], "urls": [{"url": "https://t.co/CwNeMzkDAt", "expanded_url": "https://seroter.com/2026/05/05/daily-reading-list-may-5-2026-777/", "display_url": "seroter.com/2026/05/05/dai…"}], "hashtags": [], "user_mentions": [], "quoted_tweet": null, "retweeted_tweet": null, "possibly_sensitive": false}, {"id": "2051754884295205031", "text": "We're not here to chase the AI money, and we're not here to write sloppy code. \n\nWe're building the thing that comes after git. @conradirwin shares what we're doing and why: https://t.co/f05wwOKjwO", "created_at": "Tue May 05 20:04:18 +0000 2026", "lang": "en", "author": {"id": "1471128655699062784", "name": "Zed", "username": "zeddotdev", "avatar": "https://pbs.twimg.com/profile_images/1980388529390632960/zV31W73I_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 728, "retweets": 34, "replies": 10, "views": "28653", "quotes": 6, "bookmarks": 142}, "is_retweet": false, "is_reply": false, "is_quote": false, "in_reply_to_id": null, "url": "https://x.com/zeddotdev/status/2051754884295205031", "media": [], "urls": [{"url": "https://t.co/f05wwOKjwO", "expanded_url": "https://zed.dev/blog/not-building-ai-for-the-money", "display_url": "zed.dev/blog/not-build…"}], "hashtags": [], "user_mentions": [{"id": "162814758", "name": "Conrad Irwin", "username": "conradirwin"}], "quoted_tweet": null, "retweeted_tweet": null, "possibly_sensitive": false}, {"id": "2051858018112073759", "text": "How to Work and Compound with AI\n\nhttps://t.co/Vanz92y42r", "created_at": "Wed May 06 02:54:07 +0000 2026", "lang": "en", "author": {"id": "332011447", "name": "Samuel Wong", "username": "samuel_wong_", "avatar": "https://pbs.twimg.com/profile_images/838260063798095873/d8XT-HH9_normal.jpg", "verified": false, "is_blue_verified": false}, "metrics": {"likes": 25, "retweets": 4, "replies": 1, "views": "982", "quotes": 0, "bookmarks": 10}, "is_retweet": false, "is_reply": false, "is_quote": false, "in_reply_to_id": null, "url": "https://x.com/samuel_wong_/status/2051858018112073759", "media": [], "urls": [{"url": "https://t.co/Vanz92y42r", "expanded_url": "https://eugeneyan.com/writing/working-with-ai/", "display_url": "eugeneyan.com/writing/workin…"}], "hashtags": [], "user_mentions": [], "quoted_tweet": null, "retweeted_tweet": null, "possibly_sensitive": false}, {"id": "2051984885133283362", "text": "Build your own AgentOS: https://t.co/qoeSPIIy1P https://t.co/uXy715mY8B", "created_at": "Wed May 06 11:18:15 +0000 2026", "lang": "en", "author": {"id": "2902752025", "name": "Rohit Ghumare", "username": "ghumare64", "avatar": "https://pbs.twimg.com/profile_images/2048350545476509696/ZeGm9Th9_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 19, "retweets": 2, "replies": 0, "views": "2064", "quotes": 0, "bookmarks": 20}, "is_retweet": false, "is_reply": false, "is_quote": true, "in_reply_to_id": null, "url": "https://x.com/ghumare64/status/2051984885133283362", "media": [{"id": "2051984878606880774", "type": "photo", "media_url": "https://pbs.twimg.com/media/HHodYA3WEAYcViy.jpg", "expanded_url": "https://x.com/ghumare64/status/2051984885133283362/photo/1", "display_url": "pic.x.com/uXy715mY8B", "url": "https://t.co/uXy715mY8B", "width": 1540, "height": 802}], "urls": [{"url": "https://t.co/qoeSPIIy1P", "expanded_url": "http://agentsos.sh", "display_url": "agentsos.sh"}], "hashtags": [], "user_mentions": [], "quoted_tweet": {"id": "2051845258192052527", "text": "2026 年 Subagent 的四种管理模式\n\n@_philschmid 把\"主 agent 如何驱动其它 agents\"按主 agent 对 subagent 生命周期的控制力从弱到强排成四档。模型能力越强，能驾驭的模式越复杂。\n\n模式 1：Inline Tool —— subagent 就是一次函数调用\n主 agent 通过 call_agent 工具派一个任务，等结果返回，跟调用 read_file 没本质区别。\n\n· 同步：工具调用阻塞，结果作为 tool response 返回。\n· 异步：工具立即返回一个 agent_id，结果完成后以\"通知消息\"形式注入对话。\n\n适用：自包含任务 —— 资料检索、代码 review、文件分析、测试生成。绝大多数所谓\"多 agents\"需求其实到这里就够了。 局限：没法中途追加指令、查看进度或取消。任务理解错了，只能等结果出来才知道。 门槛：任何能调用工具的模型都行，包括小模型。\n\n模式 2：Fan-Out —— 派发后再收集\n把\"派发\"和\"收集\"拆成两个工具：spawn_agent 立即返回 ID，wait_agent 阻塞等结果。\n\n关键差异：派发与等待之间，主 agent 可以做自己的事（读文件、再派新任务）。模型自己决定什么时候 wait_agent。\n\n适用：多个互相独立、可并行的任务。 局限：如果模型一 spawn 完就立刻 wait，等于退化成模式 1。价值依赖模型能合理穿插自身工作。仍然是 fire-and-forget，无法中途纠偏。 门槛：模型要能推理\"何时该等\"。\n\n模式 3：Agent Pool —— 持久化 agent + 消息通信\nsubagent 变成长寿命、有状态的成员。工具集扩展为 spawn / send_message / wait / list / kill。主 agent 可以反复给同一个 agent 发消息，对方保留完整上下文。\n\n文中示例：研究员 agent-r 第一次被派去找资料，第二次被叫来对照刚写好的草稿做事实核查 —— 它仍记得上次找到的 5 个来源。\n\nwait_agent 按消息粒度返回，主 agent 可以根据返回内容动态调整下一步指令。\n\n适用：需要专家协作的多步工作流，主 agent 充当信息路由器。 局限：主 agent 要追踪多个 agent 的状态、决定何时发消息何时等待、记得 kill_agent 释放资源。前沿模型大概能 hold 住 2–4 个 agent。\n\n模式 4：Teams —— agents 之间直接对话\n主 agent 只负责组队、定角色、启动，然后退场。每个成员都拥有 send_message，可以直接互相寻址（层级路径、文件邮箱或 IPC）。\n\n示例中主 agent 只对 planner 说一句\"你的队友是 implementer 和 reviewer，做完汇报给我\"，之后 planner <-> implementer <-> reviewer 之间的协作完全发生在主代理上下文之外。主 agent 只在有 agent 显式向它汇报时才收到结果。\n\n适用：协调逻辑本身已经超出单个 agent 能逐步管理的复杂度的大型任务。 局限：\n· 每个成员都需要前沿模型能力，不只是主 agent。\n· 基础设施问题：环路检测（A 等 B、B 等 A）、写入冲突、关停协调。\n· 调试极难，消息链难追踪，失败会级联放大。\n\n# Philipp Schmid 的核心建议\n1. 从模式 1 开始。大多数看起来像\"需要多 agents\"的任务，靠一个 prompt 写得好的内联工具调用就能解决。\n2. 真正独立可并行才升级到模式 2。\n3. 需要跨步骤协作才上模式 3。\n4. 协调逻辑本身爆炸才考虑模式 4。\n5. 每升一级，对模型能力的要求陡增。模型不够强，就停在 1 或 2。\n6. 框架提供工具，编排由模型决定。今天要 4 个 agents 协作的任务，明天可能一个更强的单 agent 就能解决。\n\n# How Agents Manage Other Agents: Four Subagents Patterns in 2026\nhttps://t.co/IohUScw6Je", "created_at": "Wed May 06 02:03:25 +0000 2026", "lang": "zh", "author": {"id": "1727548535816724480", "name": "meng shao", "username": "shao__meng", "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 212, "retweets": 53, "replies": 11, "views": "27751", "quotes": 3, "bookmarks": 229}, "is_retweet": false, "is_reply": false, "is_quote": true, "in_reply_to_id": null, "url": "https://x.com/shao__meng/status/2051845258192052527", "media": [{"id": "2051845238025789441", "type": "photo", "media_url": "https:// that explains each of the key skills: https://t.co/WebaZq88rQ", "created_at": "Tue May 05 18:50:27 +0000 2026", "lang": "en", "author": {"id": "627363", "name": "Trevin Chow", "username": "trevin", "avatar": "https://pbs.twimg.com/profile_images/2049354574516178944/OKHe6Ocu_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 68, "retweets": 10, "replies": 2, "views": "4057", "quotes": 0, "bookmarks": 90}, "is_retweet": false, "is_reply": false, "is_quote": false, "in_reply_to_id": null, "url": "https://x.com/trevin/status/2051736297883291826", "media": [], "urls": [{"url": "https://t.co/WebaZq88rQ", "expanded_url": "https://github.com/EveryInc/compound-engineering-plugin/blob/main/docs/skills/README.md", "display_url": "github.com/EveryInc/compo…"}], "hashtags": ["CompoundEngineering"], "user_mentions": [], "quoted_tweet": null, "retweeted_tweet": null, "possibly_sensitive": false}, "possibly_sensitive": false}, {"id": "2052021924021297589", "text": "Jack Dorsey just fired half his company because of AI.\n\nThen Block open-sourced the AI agent that replaced them.\n\nBlock's goose achieved approximately 4,900 stars in its first 14 days after launch, the fourth highest two-week star velocity of any open-source AI project released in April 2026.\n\nGoose is Block's internal AI coding agent, open-sourced under Apache 2.0. It is the tool that Dorsey's engineers used to replace thousands of lines of human-written code with AI-generated equivalents. Then Block decided to give it away.\n\nHere is what makes Goose different from every other AI coding agent.\nIt is not a wrapper around a single model. It is model-agnostic, you plug in Claude, GPT-5, Gemini, or any local model and it works the same way. It runs entirely on your machine. It has persistent memory across sessions. It supports MCP for custom tool integrations.\n\nAnd the design philosophy is the part that turns heads.\nGoose is built around the idea that an AI agent should be able to operate for hours or days on a single goal, not just answer one question and stop. It handles errors, retries failed steps, checks its own work, and escalates to the human only when it genuinely cannot proceed.\n\nBlock fired 5,000 people. Then gave you the tool.\nMake of that what you will.\nhttps://t.co/L9AnB3JTKU", "created_at": "Wed May 06 13:45:26 +0000 2026", "lang": "en", "author": {"id": "1690352207252819968", "name": "Elias Al", "username": "iam_elias1", "avatar": "https://pbs.twimg.com/profile_images/1927313662282174464/DwgwBa3s_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 126, "retweets": 45, "replies": 29, "views": "7162", "quotes": 0, "bookmarks": 109}, "is_retweet": false, "is_reply": false, "is_quote": false, "in_reply_to_id": null, "url": "https://x.com/iam_elias1/status/2052021924021297589", "media": [{"id": "2052021921290809344", "type": "photo", "media_url": "https://pbs.twimg.com/media/HHo_ELnacAAkRZS.jpg", "expanded_url": "https://x.com/iam_elias1/status/2052021924021297589/photo/1", "display_url": "pic.x.com/2Athxnhuq8", "url": "https://t.co/2Athxnhuq8", "width": 1911, "height": 892}], "urls": [{"url": "https://t.co/L9AnB3JTKU", "expanded_url": "http://github.com/block/goose", "display_url": "github.com/block/goose"}], "hashtags": [], "user_mentions": [], "quoted_tweet": null, "retweeted_tweet": null, "possibly_sensitive": false}, {"id": "2052063154423898603", "text": "https://t.co/UB6BAxHPMJ", "created_at": "Wed May 06 16:29:16 +0000 2026", "lang": "zxx", "author": {"id": "1713062826175299584", "name": "Avid", "username": "Av1dlive", "avatar": "https://pbs.twimg.com/profile_images/2010392290590912512/x7vtAe5W_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 115, "retweets": 24, "replies": 21, "views": "30920", "quotes": 7, "bookmarks": 230}, "is_retweet": false, "is_reply": false, "is_quote": false, "in_reply_to_id": null, "url": "https://x.com/Av1dlive/status/2052063154423898603" tps://pbs.twimg.com/profile_images/1730637509309136896/Hpwy3Qbu_normal.jpg", "verified": false, "is_blue_verified": false}, "metrics": {"likes": 0, "retweets": 58, "replies": 0, "views": null, "quotes": 0, "bookmarks": 0}, "is_retweet": true, "is_reply": false, "is_quote": false, "in_reply_to_id": null, "url": "https://x.com/flopezluis/status/2051972115855704133", "media": [], "urls": [], "hashtags": [], "user_mentions": [{"id": "12819682", "name": "Mitchell Hashimoto", "username": "mitchellh"}, {"id": "5813712", "name": "antirez", "username": "antirez"}], "quoted_tweet": null, "retweeted_tweet": {"id": "2051684321732530680", "text": "Love this post by @antirez on developing Redis Array support. Its a great showcase of thoughtful AI usage and how AI can empower even the best developers while still producing high quality work. https://t.co/xc5KhcHb2P", "created_at": "Tue May 05 15:23:55 +0000 2026", "lang": "en", "author": {"id": "12819682", "name": "Mitchell Hashimoto", "username": "mitchellh", "avatar": "https://pbs.twimg.com/profile_images/1141762999838842880/64_Y4_XB_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 832, "retweets": 58, "replies": 12, "views": "54943", "quotes": 4, "bookmarks": 587}, "is_retweet": false, "is_reply": false, "is_quote": false, "in_reply_to_id": null, "url": "https://x.com/mitchellh/status/2051684321732530680", "media": [], "urls": [{"url": "https://t.co/xc5KhcHb2P", "expanded_url": "https://antirez.com/news/164", "display_url": "antirez.com/news/164"}], "hashtags": [], "user_mentions": [{"id": "5813712", "name": "antirez", "username": "antirez"}], "quoted_tweet": null, "retweeted_tweet": null, "possibly_sensitive": false}, "possibly_sensitive": false}, {"id": "2051865033425190994", "text": "Warp 团队这是要把开源进行到底了，在 Warp、Doc 开源后，又把团队用于加速工作流的 Oz Skills 开源了 @warpdotdev 👏🏻👏🏻\n\n# Warp 团队的 15 个 Skills\nhttps://t.co/JQsHpIQvQD\n\n1. Git/GitHub 协作流（最成熟的一类）\n· create-pull-request：检查 gh CLI、分析 commits、按项目惯例生成 PR 描述。\n· ci-fix：定位失败的 GitHub Actions run → 拉日志 → 最小化修复 → 推到 ci-fix/<branch> 分支验证。强调\"最小 diff\"和不放宽 workflow 权限的安全约束。\n· github-bug-report-triage：照 issue template 评估 bug 报告的可执行性，反馈缺失信息。\n· github-issue-dedupe：用 gh search + 关键词/语义混合策略找重复 issue，可挂到 GitHub Action 里自动跑。\n\n2. 数据/分析\n· dbt-model-index：一份模板化的 dbt 模型索引（不是现成数据，而是教用户填自己的仓库结构），让 Agent 写 BigQuery SQL 前先选对表。\n· analysis-artifacts：把\"深度分析\"流程标准化——analyses/<name>/ 目录下产出 SQL、可视化、README，确保结果可复现可分享。\n\n3. Web 质量审计（直接调用 MCP 工具）\n· web-performance-audit：依赖 chrome-devtools-mcp，跑 Core Web Vitals、网络优化。\n· web-accessibility-audit：按 WCAG POUR 原则审 a11y。\n· seo-aeo-audit：技术 SEO + AI 引用优化（AEO，面向 LLM 检索时代的新概念）。\n· webapp-testing：用原生 Playwright 脚本测本地 web 应用，自带 with_server.py 管服务生命周期。\n\n4. 基础设施 / 工程规范\n· terraform-style-check：照 HashiCorp 官方风格生成/审查 Terraform。\n· mcp-builder：最厚的一个 skill——四阶段教 Agent 构建高质量 MCP server（Python FastMCP 或 TS SDK），重点强调 \"workflow tools\" 比 \"API coverage\" 更重要的设计哲学。\n\n5. 通用生产力\n· docs-update：扫描近 24h commits → 识别需要更新文档的变更 → 适配 Mintlify/Docusaurus/GitBook 等平台。\n· scheduler：本地定时提醒（明确不做云端 agent 调度，划清边界）。\n· slack-qa-investigate：只读模式深度调查代码并回答问题，强调\"先验证再回答\"。", "created_at": "Wed May 06 03:22:00 +0000 2026", "lang": "zh", "author": {"id": "1727548535816724480", "name": "meng shao", "username": "shao__meng", "avatar": "https://pbs.twimg.com/profile_images/2009826888072736772/faZAxCvC_normal.jpg", "verified": false, "is_blue_verified": true}, "metrics": {"likes": 281, "retweets": 44, "replies": 6, "views": "35087", "quotes": 3, "bookmarks": 408}, "is_retweet": false, "is_reply": false, "is_quote": true, "in_reply_to_id": null, "url": "https://x.com/shao__meng/status/2051865033425190994", "media": [{"id": "2051865014936723456", "type": "photo", "media_url": "https://pbs.twimg.com/media/HHmwXB5a4AAz-2B.jpg", "expanded_url": "https://x.com/shao__meng/status/2051865033425190994/photo/1", "display_url": "pic.x.com/8Y200XclPf", "url": "https://t.co/8Y200XclPf", "width": 3000, "height": 3000}], "urls": [{"url": "https://t. // --- standalone fetch shim: serve embedded data for ../data/* URLs ---
const __ORIG_FETCH = window.fetch.bind(window);
window.fetch = async function (url, opts) {
  const u = String(url);
  if (u.endsWith('/data/index.json') || u === '../data/index.json') {
    return new Response(JSON.stringify(__EMBEDDED.index), {
      status: 200,
      headers: { 'Content-Type': 'application/json' }
    });
  }
  // Match anything that looks like a data/<...>.json path
  const m = u.match(/(?:\.\.\/)?(data\/[^?#]+\.json)$/);
  if (m) {
    const key = m[1];
    if (__EMBEDDED.snapshots[key]) {
      return new Response(JSON.stringify(__EMBEDDED.snapshots[key]), {
        status: 200,
        headers: { 'Content-Type': 'application/json' }
      });
    }
  }
  return __ORIG_FETCH(url, opts);
};

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

async function init() {
  try {
    const resp = await fetch(INDEX_URL);
    if (!resp.ok) throw new Error(`No se pudo leer ${INDEX_URL}`);
    allSnapshots = await resp.json();
  } catch (e) {
    showError(`Error cargando index.json: ${e.message}. Recuerda servir el repo con un servidor HTTP (p.ej. <code>python -m http.server</code>).`);
    return;
  }

  if (allSnapshots.length === 0) {
    showError("No hay snapshots todavía. Ejecuta el script de captura primero.");
    return;
  }

  allSnapshots.sort((a, b) => b.fetched_at.localeCompare(a.fetched_at));

  populateSnapshots();

  snapshotSelect.addEventListener("change", loadCurrentSelection);
  sourceFilter.addEventListener("change", loadCurrentSelection);
  typeFilter.addEventListener("change", render);
  sortBy.addEventListener("change", render);
  searchInput.addEventListener("input", render);

  await loadCurrentSelection();
}

function populateSnapshots() {
  const opts = [
    { value: "all_latest", label: "Último de cada fuente (combinado)" },
    { value: "all", label: "Todos los snapshots (combinado)" },
  ];
  for (const s of allSnapshots) {
    const dateStr = new Date(s.fetched_at).toLocaleString();
    opts.push({
      value: s.file,
      label: `${dateStr} — ${s.source} (@${s.username}) — ${s.count} tweets`,
    });
  }
  snapshotSelect.innerHTML = opts
    .map((o) => `<option value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</option>`)
    .join("");
}

// ---------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------

async function loadCurrentSelection() {
  const value = snapshotSelect.value;
  const sourceWanted = sourceFilter.value;

  let snapshotsToLoad = [];
  if (value === "all") {
    snapshotsToLoad = allSnapshots;
  } else if (value === "all_latest") {
    const seen = new Set();
    for (const s of allSnapshots) {
      if (!seen.has(s.source)) {
        seen.add(s.source);
        snapshotsToLoad.push(s);
      }
    }
  } else {
    snapshotsToLoad = allSnapshots.filter((s) => s.file === value);
  }

  if (sourceWanted !== "all") {
    snapshotsToLoad = snapshotsToLoad.filter((s) => s.source === sourceWanted);
  }

  if (snapshotsToLoad.length === 0) {
    currentTweets = [];
    render();
    return;
  }

  tweetsEl.innerHTML = '<div class="spinner">Cargando…</div>';

  const all = [];
  for (const s of snapshotsToLoad) {
    try {
      const resp = await fetch(`../${s.file}`);
      const data = await resp.json();
      for (const t of data.tweets) {
        all.push({ ...t, _source: data.source, _fetched_at: data.fetched_at });
      }
    } catch (e) {
      console.error(`Failed to load ${s.file}:`, e);
    }
  }

  // Deduplicate by tweet id, keep first occurrence (most recent snapshot first)
  const seen = new Set();
  currentTweets = all.filter((t) => {
    if (seen.has(t.id)) return false;
    seen.add(t.id);
    return true;
  });

  render();
}

// ---------------------------------------------------------------------------
// Filtering + rendering
// ---------------------------------------------------------------------------

function applyFilters(tweets) {
  let filtered = tweets;

  const type = typeFilter.value;
  if (type === "original") {
    filtered = filtered.filter(
      (t) => !t.is_retweet && !t.is_reply && !t.is_quote
    );
  } else if (type === "retweet") {
    filtered = filtered.filter((t) => t.is_retweet);
  } else if (type === "reply") {
    filtered = filtered.filter((t) => t.is_reply);
  } else if (type === "quote") {
    filtered = filtered.filter((t) => t.is_quote);
  } else if (type === "media") {
    filtered = filtered.filter((t) => Array.isArray(t.media) && t.media.length > 0);
  }

  const q = searchInput.value.trim().toLowerCase();
  if (q) {
    filtered = filtered.filter((t) => {
      const haystack = [
        t.text,
        t.author?.name,
        t.author?.username,
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return haystack.includes(q);
    });
  }

  return filtered;
}

function applySort(tweets) {
  const mode = sortBy.value;
  const copy = [...tweets];
  const numeric = (v) => {
    if (v == null) return 0;
    const n = parseInt(String(v).replace(/,/g, ""), 10);
    return isNaN(n) ? 0 : n;
  };

  if (mode === "date_desc") {
    copy.sort((a, b) => parseTwitterDate(b.created_at) - parseTwitterDate(a.created_at));
  } else if (mode === "date_asc") {
    copy.sort((a, b) => parseTwitterDate(a.created_at) - parseTwitterDate(b.created_at));
  } else if (mode === "likes") {
    copy.sort((a, b) => numeric(b.metrics?.likes) - numeric(a.metrics?.likes));
  } else if (mode === "retweets") {
    copy.sort((a, b) => numeric(b.metrics?.retweets) - numeric(a.metrics?.retweets));
  } else if (mode === "replies") {
    copy.sort((a, b) => numeric(b.metrics?.replies) - numeric(a.metrics?.replies));
  } else if (mode === "views") {
    copy.sort((a, b) => numeric(b.metrics?.views) - numeric(a.metrics?.views));
  }
  return copy;
}

function render() {
  const filtered = applySort(applyFilters(currentTweets));

  statsEl.textContent = `${filtered.length} de ${currentTweets.length} tweets`;

  if (filtered.length === 0) {
    tweetsEl.innerHTML = '<div class="empty">No hay tweets con estos filtros.</div>';
    return;
  }

  tweetsEl.innerHTML = filtered.map(renderTweet).join("");
}

// ---------------------------------------------------------------------------
// Tweet rendering
// ---------------------------------------------------------------------------

function renderTweet(t) {
  // If retweet, render the underlying tweet but keep the retweet header
  const isRT = t.is_retweet && t.retweeted_tweet;
  const display = isRT ? t.retweeted_tweet : t;
  const retweeter = isRT ? t.author : null;

  const author = display.author || {};
  const m = display.metrics || {};

  let header = "";
  if (retweeter) {
    header = `<div class="tweet-context">${ICONS.retweet_small} ${escapeHtml(retweeter.name || retweeter.username || "")} retwitteó</div>`;
  }

  let replyingTo = "";
  if (display.is_reply && Array.isArray(display.user_mentions) && display.user_mentions.length > 0) {
    const m0 = display.user_mentions[0];
    replyingTo = `<div class="replying-to">Respondiendo a <a href="https://x.com/${escapeAttr(m0.username || "")}" target="_blank" rel="noopener">@${escapeHtml(m0.username || "")}</a></div>`;
  }

  const verifiedBadge = badgeFor(author);
  const text = renderText(display);
  const media = renderMedia(display.media);
  const quote = display.quoted_tweet ? renderQuote(display.quoted_tweet) : "";
  const card = renderUrlCard(display);
  const langBadge = display.lang ? `<span class="lang-badge">${escapeHtml(display.lang)}</span>` : "";

  const avatar = author.avatar
    ? `<img src="${escapeAttr(upgradeAvatar(author.avatar))}" alt="" loading="lazy">`
    : `<div style="width:100%;height:100%;background:#2f3336;"></div>`;

  return `
    <article class="tweet">
      <div class="tweet-avatar">${avatar}</div>
      <div class="tweet-body">
        ${header}
        <div class="tweet-header">
          <a class="tweet-name" href="https://x.com/${escapeAttr(author.username || "")}" target="_blank" rel="noopener">${escapeHtml(author.name || "?")}${verifiedBadge}</a>
          <span class="tweet-handle">@${escapeHtml(author.username || "?")}</span>
          <span class="tweet-sep">·</span>
          <a class="tweet-date" href="${escapeAttr(display.url || "#")}" target="_blank" rel="noopener" title="${escapeAttr(formatFullDate(display.created_at))}">${escapeHtml(formatRelative(display.created_at))}</a>
          ${langBadge}
        </div>
        ${replyingTo}
        <div class="tweet-text">${text}</div>
        ${media}
        ${quote}
        ${card}
        <div class="tweet-actions">
          <span class="tweet-action action-reply">${ICONS.reply}<span>${formatNum(m.replies)}</span></span>
          <span class="tweet-action action-retweet">${ICONS.retweet}<span>${formatNum(m.retweets)}</span></span>
          <span class="tweet-action action-like">${ICONS.like}<span>${formatNum(m.likes)}</span></span>
          <span class="tweet-action action-bookmark">${ICONS.bookmark}<span>${formatNum(m.bookmarks)}</span></span>
          <span class="tweet-action action-views">${ICONS.views}<span>${formatNum(m.views)}</span></span>
        </div>
      </div>
    </article>
  `;
}

function renderQuote(q) {
  const author = q.author || {};
  const verifiedBadge = badgeFor(author);
  const avatar = author.avatar
    ? `<img src="${escapeAttr(upgradeAvatar(author.avatar))}" alt="" loading="lazy">`
    : "";

  return `
    <a class="quote-tweet" href="${escapeAttr(q.url || "#")}" target="_blank" rel="noopener" style="text-decoration:none;display:block;">
      <div class="quote-header">
        <div class="quote-avatar">${avatar}</div>
        <span class="quote-name">${escapeHtml(author.name || "?")}${verifiedBadge}</span>
        <span class="quote-handle">@${escapeHtml(author.username || "?")}</span>
        <span class="quote-sep">·</span>
        <span class="quote-date">${escapeHtml(formatRelative(q.created_at))}</span>
      </div>
      <div class="quote-text">${renderText(q)}</div>
      ${renderMedia(q.media)}
    </a>
  `;
}

function renderText(t) {
  let text = t.text || "";

  // Remove t.co media-shortener URLs at the end (they appear when there's media)
  if (Array.isArray(t.media) && t.media.length > 0) {
    for (const m of t.media) {
      if (m.url) {
        text = text.split(m.url).join("");
      }
    }
  }
  text = text.trim();

  let html = escapeHtml(text);

  // Linkify URLs (replace t.co with display URLs)
  if (Array.isArray(t.urls)) {
    for (const u of t.urls) {
      if (!u.url) continue;
      const escUrl = escapeHtml(u.url);
      const display = u.display_url || u.expanded_url || u.url;
      const expanded = u.expanded_url || u.url;
      html = html.split(escUrl).join(
        `<a href="${escapeAttr(expanded)}" target="_blank" rel="noopener">${escapeHtml(display)}</a>`
      );
    }
  }

  // Linkify any remaining bare URLs
  html = html.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
    if (url.includes(">") || url.includes("</a")) return url;
    return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`;
  });

  // Linkify @mentions
  html = html.replace(/(^|\s)(@\w+)/g, (full, pre, mention) => {
    const username = mention.slice(1);
    return `${pre}<a href="https://x.com/${escapeAttr(username)}" target="_blank" rel="noopener">${escapeHtml(mention)}</a>`;
  });

  // Linkify #hashtags
  html = html.replace(/(^|\s)(#[\wÀ-ÿĀ-ɏ一-鿿_]+)/g, (full, pre, tag) => {
    const t = tag.slice(1);
    return `${pre}<a href="https://x.com/hashtag/${escapeAttr(t)}" target="_blank" rel="noopener">${escapeHtml(tag)}</a>`;
  });

  return html;
}

function renderMedia(media) {
  if (!Array.isArray(media) || media.length === 0) return "";
  const items = media.slice(0, 4);
  const count = items.length;
  const html = items.map((m) => {
    const src = m.media_url || "";
    const isVideo = m.type === "video" || m.type === "animated_gif";
    return `
      <div class="media-item">
        <img src="${escapeAttr(src)}" alt="" loading="lazy">
        ${isVideo ? `<span class="video-badge">${ICONS.video} ${m.type === "animated_gif" ? "GIF" : "VIDEO"}</span>` : ""}
      </div>
    `;
  }).join("");
  return `<div class="media-grid count-${count}">${html}</div>`;
}

function renderUrlCard(t) {
  // Only show a card when there's a non-Twitter URL and no media or quote
  if (Array.isArray(t.media) && t.media.length > 0) return "";
  if (t.quoted_tweet) return "";
  if (!Array.isArray(t.urls) || t.urls.length === 0) return "";

  // Take the first non-x.com link
  const u = t.urls.find((u) => {
    const e = u.expanded_url || "";
    return e && !/^https?:\/\/(x\.com|twitter\.com)/i.test(e);
  });
  if (!u) return "";

  const display = u.display_url || u.expanded_url || u.url;
  const href = u.expanded_url || u.url;
  return `
    <a class="url-card" href="${escapeAttr(href)}" target="_blank" rel="noopener">
      <div class="url-card-link">${escapeHtml(display)}</div>
    </a>
  `;
}

function badgeFor(author) {
  if (!author) return "";
  if (author.verified) return ICONS.verified_gold;
  if (author.is_blue_verified) return ICONS.verified_blue;
  return "";
}

function upgradeAvatar(url) {
  // Twitter serves _normal (48px) by default; bigger looks better on retina
  return url.replace("_normal.", "_bigger.");
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(str) {
  return escapeHtml(str);
}

function parseTwitterDate(s) {
  if (!s) return 0;
  const d = new Date(s);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

function formatRelative(s) {
  const t = parseTwitterDate(s);
  if (!t) return "";
  const diffMs = Date.now() - t;
  const sec = Math.round(diffMs / 1000);
  if (sec < 60) return `${Math.max(sec, 1)}s`;
  const min = Math.round(sec / 60);
  if (min < 60) return `${min}m`;
  const hrs = Math.round(min / 60);
  if (hrs < 24) return `${hrs}h`;
  const days = Math.round(hrs / 24);
  if (days < 7) return `${days}d`;
  const d = new Date(t);
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  const opts = sameYear ? { day: "numeric", month: "short" } : { day: "numeric", month: "short", year: "numeric" };
  return d.toLocaleDateString(undefined, opts);
}

function formatFullDate(s) {
  const t = parseTwitterDate(s);
  if (!t) return "";
  return new Date(t).toLocaleString();
}

function formatNum(v) {
  if (v == null || v === "") return "";
  const n = parseInt(String(v).replace(/,/g, ""), 10);
  if (isNaN(n) || n === 0) return "";
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1_000) return (n / 1_000).toFixed(1).replace(/\.0$/, "") + "K";
  return n.toString();
}

function showError(msg) {
  tweetsEl.innerHTML = `<div class="error">${msg}</div>`;
}

init();

</script>
</body>
</html>
