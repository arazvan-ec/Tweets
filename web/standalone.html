<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweets Browser</title>
<style>
:root {
  --bg: #15202b;
  --bg-elev: #1e2732;
  --bg-hover: #243340;
  --border: #38444d;
  --text: #e7e9ea;
  --text-muted: #71767b;
  --accent: #1d9bf0;
  --green: #00ba7c;
  --red: #f4212e;
  --yellow: #ffd400;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
}

header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
}

#stats {
  font-size: 13px;
  color: var(--text-muted);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  position: sticky;
  top: 0;
  z-index: 10;
}

.controls label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-muted);
}

.controls select,
.controls input {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: inherit;
}

.controls input[type="search"] {
  flex: 1;
  min-width: 200px;
}

.controls select:focus,
.controls input:focus {
  outline: none;
  border-color: var(--accent);
}

main {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
}

.tweet {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  transition: background 0.1s;
}

.tweet:hover {
  background: var(--bg-hover);
}

.tweet-context {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.tweet-context.retweet { color: var(--green); }
.tweet-context.reply { color: var(--accent); }
.tweet-context.quote { color: var(--yellow); }

.tweet-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.tweet-author {
  font-weight: 700;
  color: var(--text);
}

.tweet-handle {
  color: var(--text-muted);
  font-size: 14px;
}

.tweet-date {
  color: var(--text-muted);
  font-size: 14px;
  margin-left: auto;
}

.tweet-text {
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 10px;
}

.tweet-text a {
  color: var(--accent);
  text-decoration: none;
}

.tweet-text a:hover {
  text-decoration: underline;
}

.tweet-metrics {
  display: flex;
  gap: 18px;
  font-size: 13px;
  color: var(--text-muted);
}

.tweet-metrics .metric {
  display: flex;
  align-items: center;
  gap: 4px;
}

.tweet-metrics .metric strong {
  color: var(--text);
  font-weight: 600;
}

.tweet-link {
  display: block;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
}

.tweet-link:hover {
  color: var(--accent);
}

.empty {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 20px;
}

.error {
  text-align: center;
  color: var(--red);
  padding: 20px;
  background: rgba(244, 33, 46, 0.1);
  border: 1px solid var(--red);
  border-radius: 8px;
  margin: 20px;
}

footer {
  text-align: center;
  padding: 24px;
  color: var(--text-muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
}

footer code {
  background: var(--bg-elev);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.lang-badge {
  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
}

</style>
</head>
<body>

<header>
  <h1>Tweets Browser</h1>
  <div id="stats"></div>
</header>

<div class="controls">
  <label>
    Snapshot:
    <select id="snapshot-select"></select>
  </label>
  <label>
    Fuente:
    <select id="source-filter">
      <option value="all">Todas</option>
      <option value="timeline">Home timeline</option>
      <option value="mine">Mis tweets</option>
    </select>
  </label>
  <label>
    Tipo:
    <select id="type-filter">
      <option value="all">Todos</option>
      <option value="original">Solo originales</option>
      <option value="retweet">Retweets</option>
      <option value="reply">Respuestas</option>
      <option value="quote">Citas</option>
    </select>
  </label>
  <label>
    Ordenar:
    <select id="sort-by">
      <option value="date_desc">Más recientes</option>
      <option value="date_asc">Más antiguos</option>
      <option value="likes">Más likes</option>
      <option value="retweets">Más retweets</option>
      <option value="replies">Más respuestas</option>
      <option value="views">Más vistas</option>
    </select>
  </label>
  <input type="search" id="search" placeholder="Buscar texto, autor...">
</div>

<main id="tweets"></main>

<footer>
  <small>Versión autocontenida — 2 snapshots embebidos.</small>
</footer>

const INDEX_URL = null;  // unused in standalone mode

const $ = (sel) => document.querySelector(sel);
const tweetsEl = $("#tweets");
const snapshotSelect = $("#snapshot-select");
const sourceFilter = $("#source-filter");
const typeFilter = $("#type-filter");
const sortBy = $("#sort-by");
const searchInput = $("#search");
const statsEl = $("#stats");

let allSnapshots = [];
let currentTweets = [];

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

async function init() {
  allSnapshots = EMBEDDED_SNAPSHOTS.map(s => s.meta);

  if (allSnapshots.length === 0) {
    showError("No hay snapshots todavía. Ejecuta el script de captura primero.");
    return;
  }

  // Most recent first
  allSnapshots.sort((a, b) => b.fetched_at.localeCompare(a.fetched_at));

  populateSnapshots();

  snapshotSelect.addEventListener("change", loadCurrentSelection);
  sourceFilter.addEventListener("change", loadCurrentSelection);
  typeFilter.addEventListener("change", render);
  sortBy.addEventListener("change", render);
  searchInput.addEventListener("input", render);

  await loadCurrentSelection();
}

function populateSnapshots() {
  // Two synthetic options first: latest of each source + all
  const opts = [
    { value: "all_latest", label: "Último de cada fuente (combinado)" },
    { value: "all", label: "Todos los snapshots (combinado)" },
  ];
  for (const s of allSnapshots) {
    const dateStr = new Date(s.fetched_at).toLocaleString();
    opts.push({
      value: s.file,
      label: `${dateStr} — ${s.source} (@${s.username}) — ${s.count} tweets`,
    });
  }
  snapshotSelect.innerHTML = opts
    .map((o) => `<option value="${o.value}">${o.label}</option>`)
    .join("");
}

// ---------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------

async function loadCurrentSelection() {
  const value = snapshotSelect.value;
  const sourceWanted = sourceFilter.value;

  let snapshotsToLoad = [];
  if (value === "all") {
    snapshotsToLoad = allSnapshots;
  } else if (value === "all_latest") {
    const seen = new Set();
    for (const s of allSnapshots) {
      if (!seen.has(s.source)) {
        seen.add(s.source);
        snapshotsToLoad.push(s);
      }
    }
  } else {
    snapshotsToLoad = allSnapshots.filter((s) => s.file === value);
  }

  if (sourceWanted !== "all") {
    snapshotsToLoad = snapshotsToLoad.filter((s) => s.source === sourceWanted);
  }

  if (snapshotsToLoad.length === 0) {
    currentTweets = [];
    render();
    return;
  }

  tweetsEl.innerHTML = '<div class="empty">Cargando...</div>';

  const all = [];
  for (const s of snapshotsToLoad) {
    const bundle = EMBEDDED_SNAPSHOTS.find(b => b.meta.file === s.file);
    if (bundle) {
      for (const t of bundle.data.tweets) {
        all.push({ ...t, _source: bundle.data.source, _fetched_at: bundle.data.fetched_at });
      }
    }
  }

  // Deduplicate by tweet id, keep first occurrence (most recent snapshot first)
  const seen = new Set();
  currentTweets = all.filter((t) => {
    if (seen.has(t.id)) return false;
    seen.add(t.id);
    return true;
  });

  render();
}

// ---------------------------------------------------------------------------
// Filtering + rendering
// ---------------------------------------------------------------------------

function applyFilters(tweets) {
  let filtered = tweets;

  const type = typeFilter.value;
  if (type === "original") {
    filtered = filtered.filter(
      (t) => !t.is_retweet && !t.is_reply && !t.is_quote
    );
  } else if (type === "retweet") {
    filtered = filtered.filter((t) => t.is_retweet);
  } else if (type === "reply") {
    filtered = filtered.filter((t) => t.is_reply);
  } else if (type === "quote") {
    filtered = filtered.filter((t) => t.is_quote);
  }

  const q = searchInput.value.trim().toLowerCase();
  if (q) {
    filtered = filtered.filter((t) => {
      const haystack = [
        t.text,
        t.author?.name,
        t.author?.username,
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return haystack.includes(q);
    });
  }

  return filtered;
}

function applySort(tweets) {
  const mode = sortBy.value;
  const copy = [...tweets];
  const numeric = (v) => {
    if (v == null) return 0;
    const n = parseInt(String(v).replace(/,/g, ""), 10);
    return isNaN(n) ? 0 : n;
  };

  if (mode === "date_desc") {
    copy.sort((a, b) => parseTwitterDate(b.created_at) - parseTwitterDate(a.created_at));
  } else if (mode === "date_asc") {
    copy.sort((a, b) => parseTwitterDate(a.created_at) - parseTwitterDate(b.created_at));
  } else if (mode === "likes") {
    copy.sort((a, b) => numeric(b.metrics?.likes) - numeric(a.metrics?.likes));
  } else if (mode === "retweets") {
    copy.sort((a, b) => numeric(b.metrics?.retweets) - numeric(a.metrics?.retweets));
  } else if (mode === "replies") {
    copy.sort((a, b) => numeric(b.metrics?.replies) - numeric(a.metrics?.replies));
  } else if (mode === "views") {
    copy.sort((a, b) => numeric(b.metrics?.views) - numeric(a.metrics?.views));
  }
  return copy;
}

function render() {
  const filtered = applySort(applyFilters(currentTweets));

  statsEl.textContent = `${filtered.length} de ${currentTweets.length} tweets`;

  if (filtered.length === 0) {
    tweetsEl.innerHTML = '<div class="empty">No hay tweets con estos filtros.</div>';
    return;
  }

  tweetsEl.innerHTML = filtered.map(renderTweet).join("");
}

function renderTweet(t) {
  const author = t.author || {};
  const m = t.metrics || {};
  const dateLocal = formatDate(t.created_at);
  const text = linkify(escapeHtml(t.text || ""));

  let context = "";
  if (t.is_retweet) {
    context = '<div class="tweet-context retweet">↻ Retweet</div>';
  } else if (t.is_reply) {
    context = '<div class="tweet-context reply">↩ Respuesta</div>';
  } else if (t.is_quote) {
    context = '<div class="tweet-context quote">❝ Cita</div>';
  }

  const langBadge = t.lang ? `<span class="lang-badge">${escapeHtml(t.lang)}</span>` : "";

  return `
    <article class="tweet">
      ${context}
      <div class="tweet-header">
        <span class="tweet-author">${escapeHtml(author.name || "?")}</span>
        <span class="tweet-handle">@${escapeHtml(author.username || "?")}</span>
        ${langBadge}
        <span class="tweet-date">${dateLocal}</span>
      </div>
      <div class="tweet-text">${text}</div>
      <div class="tweet-metrics">
        <span class="metric">💬 <strong>${formatNum(m.replies)}</strong></span>
        <span class="metric">🔁 <strong>${formatNum(m.retweets)}</strong></span>
        <span class="metric">❤️ <strong>${formatNum(m.likes)}</strong></span>
        <span class="metric">🔖 <strong>${formatNum(m.bookmarks)}</strong></span>
        <span class="metric">👁 <strong>${formatNum(m.views)}</strong></span>
      </div>
      ${t.url ? `<a class="tweet-link" href="${t.url}" target="_blank" rel="noopener">${escapeHtml(t.url)}</a>` : ""}
    </article>
  `;
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function linkify(html) {
  return html.replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>'
  );
}

function parseTwitterDate(s) {
  if (!s) return 0;
  const d = new Date(s);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

function formatDate(s) {
  const t = parseTwitterDate(s);
  if (!t) return "";
  const d = new Date(t);
  return d.toLocaleString();
}

function formatNum(v) {
  if (v == null || v === "") return "0";
  const n = parseInt(String(v).replace(/,/g, ""), 10);
  if (isNaN(n)) return "0";
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
  if (n >= 1_000) return (n / 1_000).toFixed(1) + "K";
  return n.toString();
}

function showError(msg) {
  tweetsEl.innerHTML = `<div class="error">${msg}</div>`;
}

init();

</script>

</html>
