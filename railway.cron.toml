# Cron service config — captures both Home feeds (For You + Following)
# every minute and pushes them to Supabase.
#
# In Railway, on the cron service: Settings → Config-as-code → Config file path
# = railway.cron.toml. This way the web service (railway.toml) and the cron
# service use different startCommands from the same repo and the same image.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python scripts/fetch_tweets.py --source all_feeds --max 50"
cronSchedule = "* * * * *"
restartPolicyType = "NEVER"
