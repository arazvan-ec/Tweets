name: Archive my tweets

# Fetches the tweets from your own account (@TWITTER_USERNAME) via twikit and
# commits them to data/tweets/mine/<username>.jsonl so they live in the repo
# for later reading/analysis. Independent of the Railway/Supabase pipeline —
# this workflow never touches Supabase.
#
# Note: scheduled workflows only fire from the repo's default branch, so the
# schedule below only runs once this file is merged there.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      max:
        description: "Max tweets to fetch"
        required: false
        default: "200"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install Js2Py-3.13

      - name: Fetch and archive my tweets
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
        run: >
          python scripts/fetch_tweets.py
          --source mine
          --max ${{ github.event.inputs.max || '200' }}
          --save-local
          --no-supabase

      - name: Commit and push if there are new tweets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets
          if git diff --cached --quiet; then
            echo "No new or changed tweets."
          else
            git commit -m "Archive tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
