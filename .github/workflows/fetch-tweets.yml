name: Fetch tweets into repo

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Which source to fetch'
        required: false
        default: 'all_feeds'
        type: choice
        options:
          - all_feeds
          - for_you
          - following
          - mine
          - all
      max:
        description: 'Max tweets per source'
        required: false
        default: '100'
  schedule:
    # Every 6 hours. The Railway cron (railway.cron.toml) already refreshes
    # Supabase every minute for the live web app; this job is only about
    # archiving readable JSON snapshots into the repo for later analysis.
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-tweets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # twikit pulls this via Js2Py-3.13 but the resolver sometimes picks
          # up a different Js2Py; force the right one (see Dockerfile).
          pip install Js2Py-3.13

      - name: Restore browser cookies
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          mkdir -p data
          if [ -n "$TWITTER_COOKIES_JSON" ]; then
            printf '%s' "$TWITTER_COOKIES_JSON" > data/.cookies.json
            python -c "import json; json.load(open('data/.cookies.json'))"
          fi

      - name: Fetch tweets and save JSON snapshot
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          # Optional: only set these if you also want this run to refresh
          # the live web app's Supabase data. Not required for the JSON
          # snapshot saved to the repo.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/fetch_tweets.py \
            --source "${{ github.event.inputs.source || 'all_feeds' }}" \
            --max "${{ github.event.inputs.max || '100' }}"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git reset -- data/.cookies.json data/.session_cookies.json 2>/dev/null || true
          if git diff --quiet --staged; then
            echo "No new tweets to commit."
            exit 0
          fi
          git commit -m "chore: fetch tweets snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed, pulling and retrying ($i/3)..."
            git pull --rebase || true
            sleep $((i * 2))
          done
          exit 1
