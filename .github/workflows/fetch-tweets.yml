name: Fetch Tweets

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Feed to fetch'
        required: false
        default: 'all_feeds'
        type: choice
        options: [all_feeds, for_you, following, mine, all]
      max:
        description: 'Max tweets per source'
        required: false
        default: '100'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and save tweets
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
        run: |
          python -m scripts.save_to_repo \
            --source "${{ inputs.source || 'all_feeds' }}" \
            --max "${{ inputs.max || '100' }}"

      - name: Commit new tweets
        run: |
          git config user.name "tweets-bot"
          git config user.email "tweets-bot@users.noreply.github.com"
          git add data/tweets/
          git diff --staged --quiet \
            && echo "Nothing new to commit." \
            || (git commit -m "chore: fetch tweets $(date -u +'%Y-%m-%d %H:%M UTC')" \
                && git push)
