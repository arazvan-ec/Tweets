name: Fetch tweets

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max tweets per source'
        required: false
        default: '100'
      source:
        description: 'Which source to fetch'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - timeline
          - mine
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'

concurrency:
  group: fetch-tweets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install Js2Py-3.13

      - name: Fetch and push to Supabase
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/fetch_tweets.py \
            --source "${{ github.event.inputs.source || 'both' }}" \
            --max "${{ github.event.inputs.max || '100' }}"
