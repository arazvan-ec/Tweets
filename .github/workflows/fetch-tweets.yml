name: Fetch Tweets

on:
  schedule:
    # Every hour. Adjust to taste — cron syntax is UTC.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Max tweets per source"
        default: "100"

permissions:
  contents: write  # needed to push the data files back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT (REPO_TOKEN secret) if the default token can't push to
          # protected branches; for unprotected branches GITHUB_TOKEN is fine.
          token: ${{ secrets.REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install twikit>=2.1.0 python-dotenv>=1.0.0

      - name: Fetch tweets
        env:
          # Session cookies (preferred — avoids a login round-trip).
          # Export your current cookies with: python -c "import json; print(open('data/.cookies.json').read())"
          # then paste the JSON string into a GitHub Actions secret named TWITTER_COOKIES_JSON.
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          # Fallback: plain credentials (twikit will log in and save cookies).
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
        run: |
          MAX="${{ github.event.inputs.max || '100' }}"
          python scripts/save_tweets_to_repo.py --max "$MAX"

      - name: Commit and push new tweet files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          # Only commit if there is something new
          if git diff --staged --quiet; then
            echo "No new tweets — nothing to commit."
          else
            COUNT=$(git diff --staged --stat | tail -1)
            git commit -m "data: fetch tweets $(date -u +%Y-%m-%dT%H:%M:%SZ) [$COUNT]"
            git push origin HEAD
          fi
