name: Fetch & Save Tweets

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Feed to fetch"
        required: false
        default: "all_feeds"
        type: choice
        options:
          - all_feeds
          - for_you
          - following
          - mine
          - all
      max_tweets:
        description: "Max tweets per source"
        required: false
        default: "100"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the saved JSON files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install twikit>=2.1.0 python-dotenv>=1.0.0

      - name: Write cookies file (if secret provided)
        if: ${{ secrets.TWITTER_COOKIES_JSON != '' }}
        run: |
          mkdir -p data
          echo '${{ secrets.TWITTER_COOKIES_JSON }}' > data/.cookies.json

      - name: Fetch and save tweets
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          python scripts/save_to_repo.py \
            --source "${{ inputs.source || 'all_feeds' }}" \
            --max "${{ inputs.max_tweets || '100' }}"

      - name: Commit and push tweet data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          if git diff --cached --quiet; then
            echo "No new tweets to commit."
          else
            COUNT=$(git diff --cached --stat | tail -1)
            git commit -m "chore: fetch tweets $(date -u '+%Y-%m-%d %H:%M UTC') — $COUNT"
            git push
          fi
