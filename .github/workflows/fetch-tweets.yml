name: Fetch tweets

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max tweets per source'
        required: false
        default: '100'
      source:
        description: 'Which source to fetch'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - timeline
          - mine
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-tweets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # twikit pulls these via Js2Py-3.13 but the resolver sometimes
          # picks up a different Js2Py; force the right one.
          pip install Js2Py-3.13

      - name: Restore browser cookies
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          mkdir -p data
          printf '%s' "$TWITTER_COOKIES_JSON" > data/.cookies.json
          # Sanity check: cookies must be valid JSON
          python -c "import json; json.load(open('data/.cookies.json'))"

      - name: Fetch + push to Supabase
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/fetch_tweets.py \
            --source "${{ github.event.inputs.source || 'both' }}" \
            --max "${{ github.event.inputs.max || '100' }}"

      - name: Rebuild standalone HTML
        run: python scripts/build_standalone.py

      - name: Commit and push if changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/standalone.html
          if git diff --quiet --staged; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh tweets snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Retry push a few times in case of races with parallel commits
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed, pulling and retrying ($i/3)..."
            git pull --rebase || true
            sleep $((i * 2))
          done
          exit 1
