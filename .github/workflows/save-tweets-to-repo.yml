name: Save tweets to repo

# Fetches tweets with twikit (unofficial X client, logs in with real
# credentials — no paid X API needed) and commits them into data/<source>.json
# so the raw content lives in this repo for later reading/analysis.
#
# Runs with --no-supabase: the Railway cron service already pushes the same
# feeds to Supabase every minute for the live web UI, so this workflow only
# touches the local dataset files to avoid duplicate Supabase snapshots.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Which source(s) to fetch'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - all_feeds
          - for_you
          - following
          - mine
      max:
        description: 'Max tweets per source'
        required: false
        default: '100'
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'

concurrency:
  group: save-tweets-to-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libxml2-dev libxslt1-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install Js2Py-3.13

      - name: Fetch tweets and update data/*.json
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          python scripts/fetch_tweets.py \
            --source "${{ github.event.inputs.source || 'all' }}" \
            --max "${{ github.event.inputs.max || '100' }}" \
            --no-supabase

      - name: Commit and push updated tweet data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No new tweets, nothing to commit."
          else
            git commit -m "Update saved tweets ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
