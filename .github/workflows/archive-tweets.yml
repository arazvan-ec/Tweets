name: Archive tweets to repo

# Fetches Home (For You + Following) and your own tweets via twikit and
# commits them as JSON snapshots under data/archive/. This is independent
# from the Supabase/Railway pipeline — it exists so tweet content lives in
# the repo itself for offline reading/analysis/comparison.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   TWITTER_COOKIES_JSON  - contents of data/.cookies.json from a machine
#                           where you've already run `python scripts/fetch_tweets.py`
#                           once and logged in successfully. Strongly preferred
#                           over email/password: logging in fresh from GitHub's
#                           shared runner IPs is likely to get flagged by X.
#   TWITTER_USERNAME      - your handle, without the @ (needed to fetch "mine").
#   TWITTER_EMAIL / TWITTER_PASSWORD - fallback only, used if no cookies exist.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive-tweets
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libxml2-dev libxslt1-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install Js2Py-3.13

      - name: Fetch and archive tweets
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
        run: python -m scripts.archive_to_repo --source all --max 100

      - name: Commit and push new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive
          if git diff --cached --quiet; then
            echo "No new tweets to commit."
          else
            git commit -m "Archive tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
