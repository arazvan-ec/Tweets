name: Archive tweets to repo

# Fetches the feeds you'd actually see on X (For You + Following) plus your
# own posted tweets, and archives the raw JSON as data/tweets/*.jsonl in this
# repo so it can be read/analyzed/compared later without depending on
# Supabase. This is independent from the Railway cron, which only pushes to
# Supabase for the live web app.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      source:
        description: "Which feed(s) to archive"
        required: false
        default: "all"
        type: choice
        options: [all, all_feeds, for_you, following, mine]
      max:
        description: "Max tweets per source"
        required: false
        default: "100"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install Js2Py-3.13

      - name: Fetch and archive tweets
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
        run: |
          python scripts/fetch_tweets.py \
            --source "${{ github.event.inputs.source || 'all' }}" \
            --max "${{ github.event.inputs.max || '100' }}" \
            --save-local --skip-supabase

      - name: Commit archive if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets
          if git diff --cached --quiet; then
            echo "No new tweets to commit."
          else
            git commit -m "Archive tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
