name: Fetch Tweets to Repo

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install "twikit>=2.1.0" "python-dotenv>=1.0.0"

      # Restore saved session cookies so twikit skips the login flow.
      # Populate TWITTER_COOKIES_JSON in GitHub Secrets by copying the
      # contents of data/.cookies.json from your Railway or local run.
      - name: Restore Twitter session cookies
        run: |
          mkdir -p data
          if [ -n "$TWITTER_COOKIES_JSON" ]; then
            printf '%s' "$TWITTER_COOKIES_JSON" > data/.cookies.json
            echo "Cookies restored from secret."
          else
            echo "No TWITTER_COOKIES_JSON secret — will login with email/password."
          fi
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}

      - name: Fetch tweets and write JSONL files
        run: python scripts/save_tweets_to_repo.py --source all_feeds --max 100
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}

      - name: Commit and push new tweet data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          if git diff --cached --quiet; then
            echo "No new tweets — nothing to commit."
          else
            git commit -m "data: fetch tweets $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
