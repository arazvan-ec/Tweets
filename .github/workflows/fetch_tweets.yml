name: Fetch Tweets

on:
  schedule:
    # Runs every hour at minute 5
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Feed source'
        required: false
        default: 'all_feeds'
        type: choice
        options:
          - all_feeds
          - for_you
          - following
          - mine
          - all
      max_tweets:
        description: 'Max tweets per source'
        required: false
        default: '100'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always fetch and save to main (the data branch)
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tweets
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
        run: |
          python scripts/save_to_files.py \
            --source "${{ inputs.source || 'all_feeds' }}" \
            --max "${{ inputs.max_tweets || '100' }}"

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No new tweets — nothing to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "data: fetch tweets ${TIMESTAMP}"
            git push origin main
            echo "Pushed new tweet data."
          fi
