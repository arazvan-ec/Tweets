name: Fetch Tweets

on:
  schedule:
    # Runs at 07:00 and 19:00 UTC every day
    - cron: '0 7,19 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install Js2Py-3.13

      - name: Fetch tweets
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          python scripts/fetch_tweets.py --source all --output-dir data/tweets --max 50

      - name: Commit new tweets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          git diff --staged --quiet \
            && echo "No new tweets to commit." \
            || git commit -m "data: tweets $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
