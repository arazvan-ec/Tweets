name: Fetch Tweets

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Feed to fetch'
        required: false
        default: 'all'
        type: choice
        options: [all, for_you, following, mine]
      max:
        description: 'Max tweets per source'
        required: false
        default: '100'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tweets
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          python scripts/save_to_repo.py \
            --source ${{ github.event.inputs.source || 'all' }} \
            --max ${{ github.event.inputs.max || '100' }}

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --staged --quiet; then
            echo "No new tweets to commit."
          else
            COUNT=$(git diff --staged --stat | tail -1)
            git commit -m "data: fetch tweets $(date -u +%Y-%m-%dT%H:%M:%SZ) — ${COUNT}"
            git push
          fi
