name: Fetch Tweets to Repo

on:
  schedule:
    # Every 4 hours — adjust to taste (cron uses UTC).
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Feed to fetch (for_you | following | mine | all_feeds | all)'
        default: 'all_feeds'
      max:
        description: 'Max tweets per source'
        default: '100'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch tweets
        run: |
          python scripts/save_to_repo.py \
            --source ${{ github.event.inputs.source || 'all_feeds' }} \
            --max ${{ github.event.inputs.max || '100' }}
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          git diff --staged --quiet \
            && echo "Nothing new to commit." \
            || (git commit -m "chore: tweets $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
