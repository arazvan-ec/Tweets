name: Fetch & Save Tweets

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # also runnable manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to push the commit back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install Js2Py-3.13

      - name: Write session cookies
        # Populate the cookie file from a secret so twikit skips password login.
        # Generate it once locally: python -c "import json,pathlib; print(pathlib.Path('data/.cookies.json').read_text())"
        # then store the output as the TWITTER_COOKIES_JSON repo secret.
        if: ${{ secrets.TWITTER_COOKIES_JSON != '' }}
        run: |
          mkdir -p data
          printf '%s' "$TWITTER_COOKIES_JSON" > data/.cookies.json
        env:
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}

      - name: Fetch tweets → data/tweets/
        run: python scripts/save_to_repo.py
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
          FETCH_SOURCE: all_feeds   # for_you + following
          FETCH_MAX: "100"

      - name: Commit new tweets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          if git diff --staged --quiet; then
            echo "No new tweets — nothing to commit."
          else
            COUNT=$(git diff --staged --numstat | awk '{sum += $1} END {print sum}')
            git commit -m "chore: save tweets $(date -u +%Y-%m-%d) (+${COUNT} lines)"
            git push
          fi
