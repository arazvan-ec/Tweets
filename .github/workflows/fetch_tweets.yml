name: Fetch Tweets

on:
  schedule:
    # Every hour at :00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Feed to fetch (for_you | following | mine | all_feeds | all)'
        default: 'all_feeds'
        required: false
      max:
        description: 'Max tweets per source'
        default: '100'
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "twikit>=2.1.0" "python-dotenv>=1.0.0" Js2Py-3.13

      - name: Fetch tweets
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          python scripts/fetch_tweets.py \
            --source "${{ github.event.inputs.source || 'all_feeds' }}" \
            --max "${{ github.event.inputs.max || '100' }}" \
            --output-dir data/tweets

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tweets/
          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No new tweets to commit."
          else
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "tweets: fetch $(date -u +%Y-%m-%dT%H:%M)Z (${COUNT} file(s))"
            git push
          fi
