name: Fetch Tweets

on:
  schedule:
    # Runs 4 times a day: 7h, 13h, 19h, 23h UTC
    - cron: "0 7,13,19,23 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Feed to fetch (for_you | following | mine | all)"
        default: "all"
        required: false
      max:
        description: "Max tweets per source"
        default: "100"
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install twikit python-dotenv

      - name: Fetch tweets and save to data/
        env:
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          # Optional: pre-exported cookies JSON (avoids login on every run)
          TWITTER_COOKIES_JSON: ${{ secrets.TWITTER_COOKIES_JSON }}
        run: |
          python scripts/fetch_to_file.py \
            --source "${{ github.event.inputs.source || 'all' }}" \
            --max "${{ github.event.inputs.max || '100' }}"

      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data: tweet snapshot $DATE"
            git push
          fi
